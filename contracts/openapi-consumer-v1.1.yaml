openapi: 3.0.3
info:
  title: Next Tennis Consumer API
  version: 1.1.0
  description: Consumer-facing API contract for mobile and external clients (release scope v1.1 over /api/v1 paths). Public endpoints are tournaments, rankings, and academies (list/detail).
servers:
  - url: https://api.example.com
    description: Production
  - url: https://staging-api.example.com
    description: Staging
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Profile
  - name: Tournaments
  - name: Registrations
  - name: Schedule
  - name: Rankings
  - name: Academies
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user and create session
      operationId: loginV11
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseAuthSession'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token using refresh token
      operationId: refreshV11
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: Refresh success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseAuthSession'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenExpired'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current session
      operationId: logoutV11
      responses:
        '200':
          description: Logout success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseAuthLogout'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/auth/session:
    get:
      tags: [Auth]
      summary: Get current session info
      operationId: getSessionV11
      responses:
        '200':
          description: Session info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseAuthSessionInfo'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/me:
    get:
      tags: [Profile]
      summary: Get authenticated user profile
      operationId: getMeV11
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Profile]
      summary: Update authenticated user profile
      operationId: patchMeV11
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/tournaments:
    get:
      tags: [Tournaments]
      summary: List public tournaments
      operationId: listTournamentsV11
      security: []
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: status
          schema:
            type: string
            enum: [registration_open, registration_closed, in_progress, draft, completed, cancelled]
        - in: query
          name: academy_slug
          schema:
            type: string
        - in: query
          name: start_from
          schema:
            type: string
            format: date
        - in: query
          name: start_to
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Tournament list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseTournamentList'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/tournaments/{tournamentId}:
    get:
      tags: [Tournaments]
      summary: Get public tournament detail
      description: Public endpoint (no bearer token required).
      operationId: getTournamentByIdV11
      security: []
      parameters:
        - $ref: '#/components/parameters/TournamentId'
      responses:
        '200':
          description: Tournament detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseTournament'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tournaments/{tournamentId}/registrations:
    post:
      tags: [Registrations]
      summary: Register authenticated user in tournament category
      operationId: createRegistrationV11
      parameters:
        - $ref: '#/components/parameters/TournamentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegistrationRequest'
      responses:
        '201':
          description: Registration created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseRegistration'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'

  /api/v1/me/registrations:
    get:
      tags: [Registrations]
      summary: List own registrations
      operationId: listMyRegistrationsV11
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: state
          schema:
            type: string
            enum: [active, past, all]
            default: all
        - in: query
          name: payment_status
          schema:
            type: string
            enum: [pending, paid, refunded, waived]
        - in: query
          name: tournament_status
          schema:
            type: string
            enum: [draft, registration_open, registration_closed, in_progress, completed, cancelled]
      responses:
        '200':
          description: Own registrations list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseRegistrationList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/me/registrations/{registrationId}:
    delete:
      tags: [Registrations]
      summary: Withdraw own registration
      operationId: deleteMyRegistrationV11
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      responses:
        '200':
          description: Registration withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseRegistrationStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'

  /api/v1/me/schedule:
    get:
      tags: [Schedule]
      summary: List own match schedule
      operationId: listMyScheduleV11
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, scheduled, draft_scheduled, in_progress, completed, walkover, cancelled, postponed]
        - in: query
          name: tournament_id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Own schedule list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseScheduleList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/tournaments/{tournamentId}/schedule:
    get:
      tags: [Schedule]
      summary: List tournament schedule
      operationId: listTournamentScheduleV11
      parameters:
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: date
          schema:
            type: string
            format: date
        - in: query
          name: court_id
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, scheduled, draft_scheduled, in_progress, completed, walkover, cancelled, postponed]
      responses:
        '200':
          description: Tournament schedule list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseScheduleList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/rankings:
    get:
      tags: [Rankings]
      summary: List public rankings
      description: Public endpoint (no bearer token required).
      operationId: listRankingsV11
      security: []
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: ranking_type
          schema:
            type: string
            enum: [academy, national, tournament]
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: gender
          schema:
            type: string
        - in: query
          name: academy_id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ranking list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseRankingList'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/rankings/{rankingId}:
    get:
      tags: [Rankings]
      summary: Get public ranking detail
      description: Public endpoint (no bearer token required).
      operationId: getRankingByIdV11
      security: []
      parameters:
        - $ref: '#/components/parameters/RankingId'
      responses:
        '200':
          description: Ranking detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseRanking'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/academies:
    get:
      tags: [Academies]
      summary: List public academies
      description: Public endpoint (no bearer token required).
      operationId: listAcademiesV11
      security: []
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: city
          schema:
            type: string
        - in: query
          name: country
          schema:
            type: string
      responses:
        '200':
          description: Academy list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseAcademyList'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/academies/{academyId}:
    get:
      tags: [Academies]
      summary: Get public academy detail
      description: Public endpoint (no bearer token required).
      operationId: getAcademyByIdV11
      security: []
      parameters:
        - $ref: '#/components/parameters/AcademyId'
      responses:
        '200':
          description: Academy detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseAcademy'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TournamentId:
      in: path
      name: tournamentId
      required: true
      schema:
        type: string
        format: uuid
    RegistrationId:
      in: path
      name: registrationId
      required: true
      schema:
        type: string
        format: uuid
    RankingId:
      in: path
      name: rankingId
      required: true
      schema:
        type: string
        format: uuid
    AcademyId:
      in: path
      name: academyId
      required: true
      schema:
        type: string
        format: uuid
    Q:
      in: query
      name: q
      schema:
        type: string
      description: Search text for principal model text fields.
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: Page size. Defaults to 10.
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
      description: Opaque cursor for next page.
  responses:
    Unauthenticated:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient scope or unauthorized access
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Invalid input or query parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Business conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BusinessRuleViolation:
      description: Business rule violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCredentials:
      description: Invalid email/password or credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TokenExpired:
      description: Refresh token expired or revoked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    MetaPagination:
      type: object
      properties:
        request_id:
          type: string
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
        limit:
          type: integer
    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          nullable: true
    ErrorResponse:
      type: object
      required: [success, error, request_id]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: '#/components/schemas/ErrorObject'
        request_id:
          type: string
    AuthSession:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
        expires_at:
          type: string
          format: date-time
          nullable: true
        user:
          $ref: '#/components/schemas/Profile'
    AuthSessionInfo:
      type: object
      properties:
        is_authenticated:
          type: boolean
        user:
          $ref: '#/components/schemas/Profile'
        scopes:
          type: array
          items:
            type: string
    AuthLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    AuthRefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        display_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        avatar_url:
          type: string
          nullable: true
    Tournament:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        venue:
          type: string
          nullable: true
        status:
          type: string
    Registration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tournament_category_id:
          type: string
          format: uuid
        profile_id:
          type: string
          format: uuid
        status:
          type: string
        payment_status:
          type: string
    ScheduleMatch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        round_name:
          type: string
          nullable: true
        match_number:
          type: integer
          nullable: true
        status:
          type: string
        score_summary:
          type: string
          nullable: true
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        court_name:
          type: string
          nullable: true
    Ranking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ranking_type:
          type: string
        category:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        profile_id:
          type: string
          format: uuid
          nullable: true
        profile_name:
          type: string
        academy_id:
          type: string
          format: uuid
          nullable: true
        academy_name:
          type: string
          nullable: true
        points:
          type: integer
        rank_position:
          type: integer
        calculated_at:
          type: string
          format: date-time
          nullable: true
    Academy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
    SuccessResponseAuthSession:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/AuthSession'
        meta:
          type: object
          properties:
            request_id:
              type: string
    SuccessResponseAuthSessionInfo:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/AuthSessionInfo'
        meta:
          type: object
          properties:
            request_id:
              type: string
    SuccessResponseAuthLogout:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            status:
              type: string
              enum: [logged_out]
            updated_at:
              type: string
              format: date-time
        meta:
          type: object
          properties:
            request_id:
              type: string
    SuccessResponseProfile:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/Profile'
        meta:
          type: object
          properties:
            request_id:
              type: string
    SuccessResponseTournament:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/Tournament'
        meta:
          type: object
          properties:
            request_id:
              type: string
    SuccessResponseTournamentList:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tournament'
        meta:
          allOf:
            - $ref: '#/components/schemas/MetaPagination'
    SuccessResponseRegistration:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/Registration'
        meta:
          type: object
          properties:
            request_id:
              type: string
    SuccessResponseRegistrationStatus:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
            updated_at:
              type: string
              format: date-time
        meta:
          type: object
          properties:
            request_id:
              type: string
    SuccessResponseRegistrationList:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: '#/components/schemas/Registration'
        meta:
          allOf:
            - $ref: '#/components/schemas/MetaPagination'
    SuccessResponseScheduleList:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleMatch'
        meta:
          allOf:
            - $ref: '#/components/schemas/MetaPagination'
    SuccessResponseRanking:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/Ranking'
        meta:
          type: object
          properties:
            request_id:
              type: string
    SuccessResponseRankingList:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: '#/components/schemas/Ranking'
        meta:
          allOf:
            - $ref: '#/components/schemas/MetaPagination'
    SuccessResponseAcademy:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/Academy'
        meta:
          type: object
          properties:
            request_id:
              type: string
    SuccessResponseAcademyList:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: '#/components/schemas/Academy'
        meta:
          allOf:
            - $ref: '#/components/schemas/MetaPagination'
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        first_name:
          type: string
        last_name:
          type: string
        display_name:
          type: string
          nullable: true
        phone:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true
    CreateRegistrationRequest:
      type: object
      additionalProperties: false
      required: [tournament_category_id]
      properties:
        tournament_category_id:
          type: string
          format: uuid
        payment_proof_url:
          type: string
          format: uri
          nullable: true
        partner_id:
          type: string
          format: uuid
          nullable: true
